name: Update and publish AI daily

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: ai-daily-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      generated_at: ${{ steps.snapshot.outputs.generated_at }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install fixed dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify public publishing boundaries
        run: |
          python -m pytest -q tests/test_public_profile.py tests/test_ai_relevance.py tests/test_story_merge.py tests/test_published_at_guard.py tests/test_health.py
          node --check assets/app.js
          node --check assets/public-health.js
      - name: Restore public history
        uses: actions/cache/restore@v4
        with:
          path: data/archive.json
          key: public-history-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: public-history-v2-
      - name: Collect the 12 public sources
        run: python scripts/update_news.py --public-only --output-dir data --window-hours 24 --archive-days 21
      - name: Record the expected published snapshot
        id: snapshot
        run: python -c "import json; print('generated_at=' + json.load(open('data/latest-24h.json'))['generated_at'])" >> "$GITHUB_OUTPUT"
      - name: Generate public RSS and stage allowed files
        run: |
          python scripts/generate_feed.py --data-dir data
          python scripts/build_site.py --output _site
      - name: Save public history
        uses: actions/cache/save@v4
        with:
          path: data/archive.json
          key: public-history-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the live site and this run's snapshot
        env:
          EXPECTED_GENERATED_AT: ${{ needs.build.outputs.generated_at }}
        run: python scripts/check_health.py --minimum-generated-at "$EXPECTED_GENERATED_AT" --attempts 6 --retry-seconds 15
